name: ecotwin
x-runtime: &runtime
  build: .
  image: ecotwin-backend:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://ecotwin:ecotwin_local_only@db:5432/ecotwin
  volumes:
    - ${ECOTWIN_DATA_PATH:-./data}:/app/data:ro
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1770
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    migrate: {condition: service_completed_successfully}
services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_DB: ecotwin
      POSTGRES_USER: ecotwin
      POSTGRES_PASSWORD: ecotwin_local_only
    ports: ["127.0.0.1:${ECOTWIN_DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ecotwin -d ecotwin"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *runtime
    command: [alembic, upgrade, head]
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *runtime
    command: [uvicorn, ecotwin.api.main:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:${ECOTWIN_API_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *runtime
    command: [ecotwin, jobs, work]
    healthcheck: {disable: true}
    stop_grace_period: 15s
  ingest:
    <<: *runtime
    profiles: [ingestion]
    command: [ecotwin, --help]
    healthcheck: {disable: true}
  bootstrap:
    <<: *runtime
    profiles: [setup]
    user: "${ECOTWIN_BOOTSTRAP_UID:-1000}:${ECOTWIN_BOOTSTRAP_GID:-1000}"
    tmpfs:
      - /tmp:mode=1777
    command: [python, scripts/bootstrap_data.py, --data-dir, /app/data, --maps-dir, /app/frontend/public/maps]
    volumes:
      - ${ECOTWIN_DATA_PATH:-./data}:/app/data:rw
      - ${ECOTWIN_MAPS_PATH:-./frontend/public/maps}:/app/frontend/public/maps:rw
    environment:
      DATABASE_URL: postgresql+psycopg://ecotwin:ecotwin_local_only@db:5432/ecotwin
      ECOTWIN_LOCAL_DATA_DIR: /app/data
      ECOTWIN_CACHE_DIR: /tmp/ecotwin-cache
      PYTHONPATH: /app
    healthcheck: {disable: true}
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecotwin-frontend:local
    ports: ["127.0.0.1:${ECOTWIN_FRONTEND_PORT:-3000}:3000"]
    environment:
      ECOTWIN_API_INTERNAL_URL: http://api:8000
      APP_BASE_URL: http://localhost:${ECOTWIN_FRONTEND_PORT:-3000}
      APP_ENV: development
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      MAP_CACHE_DIR: /app/map-cache
    volumes:
      - ${ECOTWIN_DATA_PATH:-./data}/cache/maps:/app/map-cache:rw
      - ${ECOTWIN_MAPS_PATH:-./frontend/public/maps}:/app/public/maps:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama:
    profiles: [ai]
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    volumes: ["ollama_models:/root/.ollama"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 2m
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 30
    # No public/host port: the optional model service stays on the Compose network.
    mem_limit: 3g
    cpus: 4
  ollama-pull:
    profiles: [ai]
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [pull, "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama: {condition: service_healthy}
volumes:
  pgdata:
  ollama_models:
