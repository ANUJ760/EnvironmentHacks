[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ecotwin"
version = "0.2.0"
description = "Provenance-driven urban environmental screening backend"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
 "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
 "geoalchemy2>=0.17,<1", "shapely>=2.0,<3", "pyproj>=3.7,<4",
 "rasterio>=1.4,<2", "numpy>=2.2,<3", "httpx>=0.28,<1", "tenacity>=9,<10",
 "boto3>=1.37,<2", "pyjwt[crypto]>=2.10,<3", "typer>=0.15,<1",
 "structlog>=25,<26", "prometheus-client>=0.21,<1", "pyyaml>=6,<7",
 "osmium>=4,<5"
]
[project.scripts]
ecotwin = "ecotwin.ingestion.cli:main"
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "hypothesis>=6.127,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "pip-audit>=2.8,<3"]
[tool.hatch.build.targets.wheel]
packages = ["ecotwin"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL/PostGIS"]
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["ecotwin_agent_handoff", "ecotwin/units.py", "ecotwin/categories.py", "ecotwin/stream.py", "ecotwin/facility.py", "ecotwin/routing.py", "ecotwin/balance.py", "ecotwin/scenario.py", "ecotwin/synthetic.py", "ecotwin/forecasting.py", "ecotwin/optimization.py", "examples", "tests/test_*.py"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["ecotwin/models", "ecotwin/spatial/geometry.py", "ecotwin/config.py"]
follow_imports = "silent"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
